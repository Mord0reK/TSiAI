<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <h2>Chat</h2>
    </header>
    <aside>
        <h3>Chaty</h3>
        <ul>
            <li>Ogólny</li>
            <li>Tematyczne
                <ol>
                    <li>Turystyczny</li>
                    <li>Żeglarski</li>
                    <li>Filatelistyczny</li>
                    <li>Hodowla zwierzątek domowych</li>
                </ol>
            </li>
        </ul>
        <br>
        <h3>Uczestnicy</h3>
        <p>Jolanta Nowak</p>
        <img src="Jolka.jpg" alt="Jolanta Nowak">
        <br><br>
        <p>Krzysztof Łukasiński</p>
        <img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
    </aside>
    <main>
        <div id="chat">
            <div class="jolanta">
                <img src="Jolka.jpg" alt="Jolanta">
                <p>Cześć idziesz jutro do kina?</p>
            </div>
            <div class="krzysiek">
                <img src="Krzysiek.jpg" alt="Krzysiek">
                <p>Tak! A ty?</p>
            </div>
        </div>
        <form>
            <label for="wiadomosc">Wpisz wiadomość: </label>
            <input type="text" name="wiadomosc" id="wiadomosc">
            <input type="button" value="Wyślij" onclick="wyslij()">
            <br>
            <input type="button" value="Generuj losową odpowiedź" onclick="generujWiadomosc()">
        </form>
    </main>
    <footer>
        <h5>Chat wykonał: 12345678910</h5>
    </footer>
    <script src="script.js"></script>
</body>
</html>
