<svg width="40" height="30" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo firmy transportowej" role="img">
    <!-- Część ciężarówki -->
    <rect x="5" y="20" width="40" height="15" fill="#6c757d" rx="3" ry="3"/>
    <rect x="45" y="15" width="14" height="20" fill="#28a745" rx="2" ry="2"/>
    <circle cx="15" cy="38" r="6" fill="#343a40"/>
    <circle cx="45" cy="38" r="6" fill="#343a40"/>
    <circle cx="15" cy="38" r="3" fill="#adb5bd"/>
    <circle cx="45" cy="38" r="3" fill="#adb5bd"/>
    <!-- Linia pozioma oddzielająca kabinę -->
    <line x1="45" y1="25" x2="59" y2="25" stroke="#e9ecef" stroke-width="2"/>
    <!-- Napis skrócony -->
    <text x="5" y="14" fill="#28a745" font-family="Arial, sans-serif" font-weight="bold" font-size="10">TransportPro</text>
</svg>
